<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitb Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #0A0A0B;
    --panel: #141415;
    --panel-2: #1C1D1F;
    --border: #2C2D2F;
    --text: #ECECED;
    --muted: #8B8C8E;
    --accent: #D9D9DB;
    --accent-dim: #4A4A4C;
    --good: #6FCF97;
    --bad: #E98A8A;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: Helvetica, Arial, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:32px 20px 80px;}
  .wrap{max-width:900px;margin:0 auto;}

  .topbar{
    position:relative; z-index:20;
    background:var(--bg);
    margin:-32px -20px 28px;
    padding:20px 20px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-center{
    font-family:var(--sans); font-size:26px; font-weight:700; letter-spacing:0.01em; color:var(--text);
  }
  .folder-control{position:absolute; right:20px; top:50%; transform:translateY(-50%);}

  button{
    font-family:var(--sans); font-size:13.5px; cursor:pointer;
    border-radius:7px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text);
    padding:9px 14px; transition:border-color .15s, background .15s, transform .05s;
  }
  button:hover{border-color:#45464a;}
  button:active{transform:translateY(1px);}
  button.primary{background:linear-gradient(180deg,#f0f0f1,#d4d4d6); border-color:#d4d4d6; color:#141415; font-weight:600;}
  button.primary:hover{background:linear-gradient(180deg,#ffffff,#e2e2e4);}
  button.ghost{background:transparent;}
  button.small{padding:6px 10px; font-size:12px;}
  button:disabled{opacity:.5; cursor:not-allowed;}

  .status-pill{
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
    background:var(--panel-2); border:1px solid var(--border); border-radius:20px; padding:7px 13px;
  }
  .status-pill:hover{border-color:#45464a; color:var(--text);}
  .status-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block;}
  .status-pill.ok .dot{background:var(--good);}
  .folder-menu{
    position:absolute; right:0; top:calc(100% + 8px);
    display:flex; flex-direction:column; gap:6px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); min-width:190px;
  }
  .folder-menu[hidden]{display:none;}
  .folder-menu button{text-align:left;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:28px 30px; margin-bottom:22px;
  }

  h1.date-head{
    font-family:var(--serif); font-weight:600; font-size:28px; text-align:center;
    margin:0 0 16px; color:var(--text);
  }
  .date-row{display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:22px;}
  .date-row input[type="date"]{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 10px; font-family:var(--sans); font-size:14px;
    color-scheme: dark;
  }
  .date-hint{text-align:center; font-size:12px; color:var(--muted); margin-top:-14px; margin-bottom:22px;}

  .summary{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:6px;
  }
  .field label{display:block; font-size:11.5px; text-transform:none; color:var(--muted); margin-bottom:6px; letter-spacing:.01em;}
  .field input[type="text"]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:9px 11px; font-size:14px; font-family:var(--sans);
  }
  .field input::placeholder{color:#55565a;}

  h2.section-title{
    font-family:var(--serif); font-size:17px; font-weight:600; margin:0 0 16px; color:var(--text);
    display:flex; align-items:center; justify-content:center; gap:10px; text-align:center;
  }
  h2.section-title::before{content:""; flex:1; height:1px; background:var(--border);}
  h2.section-title::after{content:""; flex:1; height:1px; background:var(--border);}

  .slots-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 28px;}
  .slot-col{display:flex; flex-direction:column;}
  .slot-row{
    display:grid; grid-template-columns:56px 1fr; align-items:center; gap:10px;
    padding:6px 0; border-bottom:1px dashed #202021;
  }
  .slot-row time{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .slot-row input[type="text"]{
    background:transparent; border:none; border-bottom:1px solid transparent;
    color:var(--text); font-size:14px; padding:4px 2px; font-family:var(--sans);
  }
  .slot-row input[type="text"]:focus{outline:none; border-bottom:1px solid var(--accent);}
  .slot-row input[type="text"]:not(:placeholder-shown){color:var(--text);}
  .slot-row.has-text{border-bottom-color:#303032;}
  .slot-row.has-text time{color:var(--accent);}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:720px){ .two-col{grid-template-columns:1fr;} .slots-grid{grid-template-columns:1fr;} .summary{grid-template-columns:1fr;} }

  .list-item{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .list-item input[type="checkbox"]{
    appearance:none; width:16px; height:16px; border-radius:4px; border:1px solid var(--border);
    background:var(--panel-2); cursor:pointer; flex:none; position:relative;
  }
  .list-item input[type="checkbox"]:checked{background:var(--accent); border-color:var(--accent);}
  .list-item input[type="checkbox"]:checked::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#141415;
  }
  .list-item .idx{font-size:12.5px; color:var(--muted); width:14px; flex:none;}
  .list-item input[type="text"]{
    flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:var(--sans);
  }
  .list-item .rm{
    flex:none; border:none; background:transparent; color:var(--muted); font-size:15px; padding:2px 6px; cursor:pointer;
  }
  .list-item .rm:hover{color:var(--bad);}

  .save-bar{display:flex; justify-content:center; margin:30px 0 10px;}
  .save-bar .primary{padding:13px 28px; font-size:14.5px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:9px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:#2f4a3a;}
  .toast.err{border-color:#4a2f2f;}
  .toast .dot{width:8px; height:8px; border-radius:50%; background:var(--good);}
  .toast.err .dot{background:var(--bad);}

</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand-center">Bitb Planner</div>
    <div class="folder-control">
      <button class="status-pill" id="folderStatusBtn" type="button" aria-expanded="false">
        <span class="dot"></span><span id="folderStatusText">No folder chosen</span>
      </button>
      <div class="folder-menu" id="folderMenu" hidden>
        <button class="ghost small" id="chooseFolderBtn" type="button">Choose / change folder</button>
        <button class="ghost small" id="downloadBtn" type="button">Download .docx</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h1 class="date-head" id="dateHeading">—</h1>
    <div class="date-row">
      <input type="date" id="dateInput">
    </div>

    <div class="summary">
      <div class="field">
        <label for="hoursField">Hours</label>
        <input type="text" id="hoursField">
      </div>
      <div class="field">
        <label for="focusField">Focus</label>
        <input type="text" id="focusField">
      </div>
      <div class="field">
        <label for="outputField">Output</label>
        <input type="text" id="outputField">
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">The day</h2>
    <div class="slots-grid">
      <div class="slot-col" id="slotColLeft"></div>
      <div class="slot-col" id="slotColRight"></div>
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <h2 class="section-title">Productivity inventory</h2>
      <div id="inventoryList"></div>
    </div>
    <div class="card">
      <h2 class="section-title">How could I improve?</h2>
      <div id="improveList"></div>
    </div>
  </div>

  <div class="save-bar">
    <button class="primary" id="saveBtn" type="button">Save &amp; start tomorrow →</button>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function escapeXml(s){
    return String(s==null? "": s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
  }
  function toast(msg, ok){
    var t = document.getElementById('toast');
    var m = document.getElementById('toastMsg');
    m.textContent = msg;
    t.classList.remove('ok','err');
    t.classList.add(ok ? 'ok' : 'err');
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 4200);
  }
  function fmtHeading(dateObj){
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    return days[dateObj.getDay()] + " · " + pad(dateObj.getDate()) + "/" + pad(dateObj.getMonth()+1) + "/" + dateObj.getFullYear();
  }
  function isoFromDate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function dateFromIso(iso){
    var p = iso.split("-").map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  }

  /* ---------- time slots (00:00 - 23:30, 48 half-hour slots, split into two 12h columns) ---------- */
  var ALL_TIMES = [];
  for(var h=0; h<24; h++){
    ALL_TIMES.push(pad(h)+":00");
    ALL_TIMES.push(pad(h)+":30");
  }
  var LEFT_TIMES = ALL_TIMES.slice(0,24);
  var RIGHT_TIMES = ALL_TIMES.slice(24);

  function buildSlotColumn(container, times, startIndex){
    times.forEach(function(t, i){
      var row = document.createElement('div');
      row.className = 'slot-row';
      var time = document.createElement('time');
      time.textContent = t;
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '';
      input.dataset.time = t;
      input.addEventListener('input', function(){
        row.classList.toggle('has-text', input.value.trim().length>0);
      });
      row.appendChild(time);
      row.appendChild(input);
      container.appendChild(row);
    });
  }
  buildSlotColumn(document.getElementById('slotColLeft'), LEFT_TIMES);
  buildSlotColumn(document.getElementById('slotColRight'), RIGHT_TIMES);

  function getSlotData(){
    var out = [];
    document.querySelectorAll('.slot-row input[type="text"]').forEach(function(inp){
      out.push({ time: inp.dataset.time, text: inp.value });
    });
    return out;
  }
  function clearSlots(){
    document.querySelectorAll('.slot-row input[type="text"]').forEach(function(inp){
      inp.value = '';
      inp.parentElement.classList.remove('has-text');
    });
  }

  /* ---------- dynamic lists (inventory / improve) ---------- */
  function makeListItem(withCheckbox, index, value, checked){
    var row = document.createElement('div');
    row.className = 'list-item';
    if(withCheckbox){
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!checked;
      row.appendChild(cb);
    } else {
      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = (index+1) + '.';
      row.appendChild(idx);
    }
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = value || '';
    inp.placeholder = '';
    row.appendChild(inp);
    var rm = document.createElement('button');
    rm.className = 'rm'; rm.type='button'; rm.textContent = '×'; rm.title='Remove';
    rm.addEventListener('click', function(){ row.remove(); renumber(); });
    row.appendChild(rm);
    return row;
  }
  function renumberList(container){
    container.querySelectorAll('.list-item').forEach(function(row, i){
      var idx = row.querySelector('.idx');
      if(idx) idx.textContent = (i+1)+'.';
    });
  }
  function renumber(){
    renumberList(inventoryList);
    renumberList(improveList);
  }
  var inventoryList = document.getElementById('inventoryList');
  var improveList = document.getElementById('improveList');
  function seedLists(){
    for(var i=0;i<3;i++){
      inventoryList.appendChild(makeListItem(false, i, '', false));
      improveList.appendChild(makeListItem(false, i, '', false));
    }
  }
  seedLists();
  renumber();
  function getInventory(){
    var out = [];
    inventoryList.querySelectorAll('.list-item').forEach(function(row){
      out.push({ checked: false, text: row.querySelector('input[type="text"]').value });
    });
    return out;
  }
  function getImprove(){
    var out = [];
    improveList.querySelectorAll('.list-item').forEach(function(row){
      out.push(row.querySelector('input[type="text"]').value);
    });
    return out;
  }
  function clearLists(){
    inventoryList.innerHTML=''; improveList.innerHTML=''; seedLists();
  }

  /* ---------- date field + revisiting a saved date ---------- */
  var dateInput = document.getElementById('dateInput');
  var dateHeading = document.getElementById('dateHeading');

  function resetFormFields(){
    document.getElementById('hoursField').value = '';
    document.getElementById('focusField').value = '';
    document.getElementById('outputField').value = '';
    clearSlots();
    clearLists();
  }

  function populateForm(rec){
    document.getElementById('hoursField').value = rec.hours || '';
    document.getElementById('focusField').value = rec.focus || '';
    document.getElementById('outputField').value = rec.output || '';
    var byTime = {};
    (rec.slots||[]).forEach(function(s){ byTime[s.time] = s.text; });
    document.querySelectorAll('.slot-row input[type="text"]').forEach(function(inp){
      var v = byTime[inp.dataset.time] || '';
      inp.value = v;
      inp.parentElement.classList.toggle('has-text', v.trim().length>0);
    });
    inventoryList.innerHTML = '';
    improveList.innerHTML = '';
    var inv = (rec.inventory && rec.inventory.length) ? rec.inventory : [{checked:false,text:''},{checked:false,text:''},{checked:false,text:''}];
    inv.forEach(function(item,i){ inventoryList.appendChild(makeListItem(false, i, item.text, item.checked)); });
    var imp = (rec.improve && rec.improve.length) ? rec.improve : ['','',''];
    imp.forEach(function(text,i){ improveList.appendChild(makeListItem(false, i, text, false)); });
    renumber();
  }

  async function loadForDate(iso){
    try{
      var rec = await idbGet('plans', iso);
      if(rec){
        populateForm(rec);
        toast('Showing your saved plan for ' + rec.ddmmyyyy, true);
      } else {
        resetFormFields();
      }
    }catch(e){
      resetFormFields();
    }
  }

  async function goToDate(iso){
    dateInput.value = iso;
    dateHeading.textContent = fmtHeading(dateFromIso(iso));
    await loadForDate(iso);
  }

  dateInput.addEventListener('change', function(){
    if(dateInput.value) goToDate(dateInput.value);
  });

  (function initDate(){
    var d = new Date();
    d.setDate(d.getDate()+1);
    goToDate(isoFromDate(d));
  })();

  /* ---------- gather full plan ---------- */
  function gatherPlan(){
    var iso = dateInput.value || isoFromDate(new Date());
    var d = dateFromIso(iso);
    return {
      iso: iso,
      dateLabel: fmtHeading(d),
      ddmmyyyy: pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(),
      hours: document.getElementById('hoursField').value,
      focus: document.getElementById('focusField').value,
      output: document.getElementById('outputField').value,
      slots: getSlotData(),
      inventory: getInventory(),
      improve: getImprove()
    };
  }

  /* ================= DOCX GENERATION (OOXML via JSZip) ================= */

  var CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
    '</Types>';

  var RELS_ROOT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
    '</Relationships>';

  var DOC_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';

  var APP_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">' +
    '<Application>Night Planner</Application></Properties>';

  function coreXml(plan){
    var now = new Date().toISOString().replace(/\.\d+Z$/,'Z');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      '<dc:title>Day Plan ' + escapeXml(plan.ddmmyyyy) + '</dc:title>' +
      '<dc:creator>Night Planner</dc:creator>' +
      '<cp:lastModifiedBy>Night Planner</cp:lastModifiedBy>' +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + now + '</dcterms:modified>' +
      '</cp:coreProperties>';
  }

  function p(text, opts){
    opts = opts || {};
    var rpr = '';
    if(opts.bold) rpr += '<w:b/>';
    if(opts.size) rpr += '<w:sz w:val="'+opts.size+'"/><w:szCs w:val="'+opts.size+'"/>';
    if(opts.color) rpr += '<w:color w:val="'+opts.color+'"/>';
    var ppr = '';
    if(opts.pageBreakBefore) ppr += '<w:pageBreakBefore/>';
    if(opts.center) ppr += '<w:jc w:val="center"/>';
    if(opts.spacingAfter!=null) ppr += '<w:spacing w:after="'+opts.spacingAfter+'"/>';
    var runPr = rpr ? '<w:rPr>'+rpr+'</w:rPr>' : '';
    var pPr = ppr ? '<w:pPr>'+ppr+'</w:pPr>' : '';
    return '<w:p>'+pPr+'<w:r>'+runPr+'<w:t xml:space="preserve">'+escapeXml(text)+'</w:t></w:r></w:p>';
  }

  function emptyPara(){ return '<w:p/>'; }

  function tc(text, width, opts){
    opts = opts || {};
    var rpr = opts.bold ? '<w:rPr><w:b/></w:rPr>' : '<w:rPr/>';
    return '<w:tc><w:tcPr><w:tcW w:w="'+width+'" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>' +
      '<w:p><w:r>'+rpr+'<w:t xml:space="preserve">'+escapeXml(text)+'</w:t></w:r></w:p></w:tc>';
  }

  function buildSlotsTable(slots){
    var half = slots.length/2;
    var left = slots.slice(0, half);
    var right = slots.slice(half);
    var wTime = 1100, wText = 3500;
    var grid = '<w:tblGrid>' +
      '<w:gridCol w:w="'+wTime+'"/><w:gridCol w:w="'+wText+'"/>' +
      '<w:gridCol w:w="'+wTime+'"/><w:gridCol w:w="'+wText+'"/>' +
      '</w:tblGrid>';
    var borders = '<w:tblBorders>' +
      '<w:top w:val="single" w:sz="4" w:color="BFBFBF"/>' +
      '<w:left w:val="single" w:sz="4" w:color="BFBFBF"/>' +
      '<w:bottom w:val="single" w:sz="4" w:color="BFBFBF"/>' +
      '<w:right w:val="single" w:sz="4" w:color="BFBFBF"/>' +
      '<w:insideH w:val="single" w:sz="4" w:color="E0E0E0"/>' +
      '<w:insideV w:val="single" w:sz="4" w:color="E0E0E0"/>' +
      '</w:tblBorders>';
    var rows = '';
    for(var i=0;i<half;i++){
      var l = left[i], r = right[i];
      rows += '<w:tr>' +
        tc(l.time, wTime, {bold:true}) + tc(l.text, wText) +
        tc(r.time, wTime, {bold:true}) + tc(r.text, wText) +
        '</w:tr>';
    }
    return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/>' + borders + '<w:tblLayout w:type="fixed"/></w:tblPr>' +
      grid + rows + '</w:tbl>';
  }

  function buildDocumentXml(plan){
    var body = '';
    body += p(plan.ddmmyyyy, {bold:true, size:44, center:true, spacingAfter:60});
    body += p(plan.dateLabel, {center:true, color:'666666', size:20, spacingAfter:260});

    body += p('Hours: ' + (plan.hours||'—'), {bold:false, size:21});
    body += p('Focus: ' + (plan.focus||'—'), {size:21});
    body += p('Output: ' + (plan.output||'—'), {size:21, spacingAfter:240});

    body += p('The day', {bold:true, size:26, spacingAfter:120});
    body += buildSlotsTable(plan.slots);
    body += emptyPara();

    body += p('Productivity inventory', {bold:true, size:26, spacingAfter:100, pageBreakBefore:true});
    plan.inventory.forEach(function(item, i){
      if(item.text && item.text.trim().length){
        body += p((i+1) + '. ' + item.text, {size:21});
      }
    });
    if(!plan.inventory.some(function(i){return i.text && i.text.trim().length;})){
      body += p('—', {size:21, color:'999999'});
    }
    body += emptyPara();

    body += p('How could I improve?', {bold:true, size:26, spacingAfter:100});
    var any = false;
    plan.improve.forEach(function(text, i){
      if(text && text.trim().length){ any = true; body += p((i+1)+'. '+text, {size:21}); }
    });
    if(!any) body += p('—', {size:21, color:'999999'});

    var sectPr = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/>' +
      '</w:sectPr>';

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:body>' + body + sectPr + '</w:body></w:document>';
  }

  async function generateDocxBlob(plan){
    if(typeof JSZip === 'undefined'){
      throw new Error('The .docx generator library did not load — this page needs internet the first time to fetch it.');
    }
    var zip = new JSZip();
    zip.file('[Content_Types].xml', CONTENT_TYPES);
    zip.folder('_rels').file('.rels', RELS_ROOT);
    zip.folder('docProps').file('core.xml', coreXml(plan));
    zip.folder('docProps').file('app.xml', APP_XML);
    var wordFolder = zip.folder('word');
    wordFolder.file('document.xml', buildDocumentXml(plan));
    wordFolder.folder('_rels').file('document.xml.rels', DOC_RELS);
    return await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  function filenameFor(plan){
    return 'DayPlan_' + plan.iso + '.docx';
  }

  /* ---------- IndexedDB: folder handle persistence + saved daily plans ---------- */
  var DB_NAME = 'night-planner-db', DB_VERSION = 2;
  function idbOpen(){
    return new Promise(function(resolve,reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
        if(!db.objectStoreNames.contains('plans')) db.createObjectStore('plans');
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbSet(store, key, val){
    return idbOpen().then(function(db){
      return new Promise(function(resolve,reject){
        var tx = db.transaction(store,'readwrite');
        tx.objectStore(store).put(val,key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbGet(store, key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve,reject){
        var tx = db.transaction(store,'readonly');
        var req = tx.objectStore(store).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  var dirHandle = null;
  var fsaSupported = 'showDirectoryPicker' in window;

  var folderStatusBtn = document.getElementById('folderStatusBtn');
  var folderStatusText = document.getElementById('folderStatusText');
  var folderMenu = document.getElementById('folderMenu');

  function setFolderStatus(label, ok){
    folderStatusBtn.classList.toggle('ok', !!ok);
    folderStatusText.textContent = label;
  }

  folderStatusBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var isHidden = folderMenu.hasAttribute('hidden');
    if(isHidden){
      folderMenu.removeAttribute('hidden');
      folderStatusBtn.setAttribute('aria-expanded','true');
    } else {
      folderMenu.setAttribute('hidden','');
      folderStatusBtn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('click', function(e){
    if(!folderMenu.hasAttribute('hidden') && !folderMenu.contains(e.target) && e.target !== folderStatusBtn){
      folderMenu.setAttribute('hidden','');
      folderStatusBtn.setAttribute('aria-expanded','false');
    }
  });

  if(!fsaSupported){
    setFolderStatus('Auto-save needs Chrome/Edge — use Download instead');
    document.getElementById('chooseFolderBtn').disabled = true;
  }

  async function restoreHandle(){
    if(!fsaSupported) return;
    try{
      var h = await idbGet('handles', 'folderHandle');
      if(h){
        var perm = await h.queryPermission({mode:'readwrite'});
        if(perm === 'granted'){
          dirHandle = h;
          setFolderStatus('Saving to "'+h.name+'"', true);
        } else {
          dirHandle = h;
          setFolderStatus('Folder "'+h.name+'" chosen — click Save to re-confirm access');
        }
      }
    }catch(e){ /* ignore */ }
  }
  restoreHandle();

  async function chooseFolder(){
    if(!fsaSupported){ toast("Your browser can't auto-save to a folder. Use Download .docx instead.", false); return null; }
    try{
      var h = await window.showDirectoryPicker({ mode:'readwrite' });
      dirHandle = h;
      await idbSet('handles', 'folderHandle', h);
      setFolderStatus('Saving to "'+h.name+'"', true);
      folderMenu.setAttribute('hidden','');
      folderStatusBtn.setAttribute('aria-expanded','false');
      return h;
    }catch(e){
      if(e && e.name === 'AbortError') return null;
      toast('Could not open folder picker: ' + e.message, false);
      return null;
    }
  }
  document.getElementById('chooseFolderBtn').addEventListener('click', chooseFolder);

  async function ensureFolder(){
    if(!fsaSupported) return null;
    if(dirHandle){
      try{
        var perm = await dirHandle.queryPermission({mode:'readwrite'});
        if(perm !== 'granted'){
          perm = await dirHandle.requestPermission({mode:'readwrite'});
        }
        if(perm === 'granted'){
          setFolderStatus('Saving to "'+dirHandle.name+'"', true);
          return dirHandle;
        }
      }catch(e){ /* fall through to re-pick */ }
    }
    return await chooseFolder();
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  async function saveToFolder(blob, filename){
    var handle = await ensureFolder();
    if(!handle){
      downloadBlob(blob, filename);
      return { method:'download' };
    }
    var fileHandle = await handle.getFileHandle(filename, { create:true });
    var writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return { method:'folder', folderName: handle.name };
  }

  /* ---------- button actions ---------- */
  document.getElementById('downloadBtn').addEventListener('click', async function(){
    folderMenu.setAttribute('hidden','');
    folderStatusBtn.setAttribute('aria-expanded','false');
    try{
      var plan = gatherPlan();
      var blob = await generateDocxBlob(plan);
      downloadBlob(blob, filenameFor(plan));
      toast('Downloaded ' + filenameFor(plan), true);
    }catch(e){
      toast('Could not create the file: ' + e.message, false);
    }
  });

  document.getElementById('saveBtn').addEventListener('click', async function(){
    var btn = this;
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Saving…';
    try{
      var plan = gatherPlan();
      var blob = await generateDocxBlob(plan);
      var filename = filenameFor(plan);
      var result = await saveToFolder(blob, filename);
      await idbSet('plans', plan.iso, plan);
      if(result.method === 'folder'){
        toast('Saved "'+filename+'" to "'+result.folderName+'"', true);
      } else {
        toast('Downloaded "'+filename+'" (pick a folder to auto-save next time)', true);
      }
      // move on to the next night
      var nextDay = dateFromIso(plan.iso);
      nextDay.setDate(nextDay.getDate()+1);
      await goToDate(isoFromDate(nextDay));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }catch(e){
      toast('Could not save: ' + e.message, false);
    }finally{
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

})();
</script>
</body>
